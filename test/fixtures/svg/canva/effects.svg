<svg width="500" height="280" viewBox="0 0 500 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="blur">
      <feGaussianBlur stdDeviation="8" />
    </filter>
    <clipPath id="pill">
      <rect x="40" y="36" width="420" height="208" rx="30" />
    </clipPath>
  </defs>
  <rect width="500" height="280" fill="#111827" />
  <g clip-path="url(#pill)">
    <circle cx="116" cy="92" r="56" fill="#ff8a5b" filter="url(#blur)" />
    <circle cx="390" cy="120" r="64" fill="#3350d8" filter="url(#blur)" />
    <rect x="40" y="36" width="420" height="208" rx="30" fill="rgba(255,255,255,0.08)" />
  </g>
  <text x="58" y="166" font-size="30" font-family="Arial" fill="#f8fafc">Filters and clip paths should stay inside the raster background.</text>
</svg>
