<style>
  .all2html-ae {
    color-scheme: dark;
    font-family:
      ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .all2html-ae,
  .all2html-ae * {
    box-sizing: border-box;
  }

  .all2html-ae__errors {
    margin: 0 0 12px;
    padding: 12px 14px;
    border: 1px solid #8c3434;
    background: rgba(140, 52, 52, 0.18);
    border-radius: 8px;
    color: #ffd1d1;
    display: none;
  }

  .all2html-ae__errors.visible {
    display: block;
  }

  .all2html-ae__stage {
    position: relative;
    width: 100%;
    margin: 0;
    background: #000;
    overflow: hidden;
  }

  .all2html-ae__video {
    display: block;
    width: 100%;
    height: auto;
  }

  .all2html-ae__overlays {
    position: absolute;
    left: 0;
    top: 0;
    width: 0;
    height: 0;
    transform-origin: 0 0;
    pointer-events: none;
  }

  .all2html-ae__overlay {
    position: absolute;
    left: 0;
    top: 0;
    white-space: pre-wrap;
    will-change: transform, opacity;
  }
</style>

<div class="all2html-ae" data-all2html-ae>
  <div class="all2html-ae__errors" data-ae-role="errors"></div>
  <div class="all2html-ae__stage" data-ae-role="stage">
    <video
      class="all2html-ae__video"
      data-ae-role="video"
      playsinline
      controls
      preload="metadata"
    ></video>
    <div class="all2html-ae__overlays" data-ae-role="overlays"></div>
  </div>

  <script type="application/json" data-ae-role="model">
__MODEL_JSON__
  </script>

  <script>
    (function () {
      function findRootForScript(scriptEl) {
        var node = scriptEl;
        while (node) {
          if (
            node.getAttribute &&
            node.getAttribute("data-all2html-ae") !== null
          ) {
            return node;
          }
          node = node.parentNode;
        }
        return null;
      }

      var currentScript = document.currentScript;
      var root = currentScript ? findRootForScript(currentScript) : null;
      if (!root) return;

      var modelEl = root.querySelector('[data-ae-role="model"]');
      var errorsEl = root.querySelector('[data-ae-role="errors"]');
      var videoEl = root.querySelector('[data-ae-role="video"]');
      var stageEl = root.querySelector('[data-ae-role="stage"]');
      var overlaysEl = root.querySelector('[data-ae-role="overlays"]');
      if (!modelEl || !errorsEl || !videoEl || !stageEl || !overlaysEl) {
        return;
      }

      var model = JSON.parse(modelEl.textContent);
      var overlayNodes = {};
      var rafId = null;
      var stageScale = 1;

      function showError(message) {
        errorsEl.textContent = message;
        errorsEl.className = "all2html-ae__errors visible";
      }

      function hideError() {
        errorsEl.textContent = "";
        errorsEl.className = "all2html-ae__errors";
      }

      function hasNumber(value) {
        return typeof value === "number" && isFinite(value);
      }

      function validateLayer(name, layer) {
        var span = layer.end - layer.start + 1;
        if (!hasNumber(layer.start) || !hasNumber(layer.end) || layer.start > layer.end) {
          throw new Error('Layer "' + name + '" has an invalid start/end range.');
        }
        if (layer.animatedTransforms) {
          for (var i = 0; i < layer.animatedTransforms.length; i += 1) {
            var prop = layer.animatedTransforms[i];
            var values = layer[prop];
            if (!values || typeof values.length !== "number") {
              throw new Error('Layer "' + name + '" is missing animated property "' + prop + '".');
            }
            if (values.length !== span) {
              throw new Error(
                'Layer "' +
                  name +
                  '" property "' +
                  prop +
                  '" has ' +
                  values.length +
                  " samples but expected " +
                  span +
                  "."
              );
            }
            if (prop === "pos") {
              for (var j = 0; j < values.length; j += 1) {
                if (
                  !values[j] ||
                  values[j].length !== 2 ||
                  !hasNumber(values[j][0]) ||
                  !hasNumber(values[j][1])
                ) {
                  throw new Error('Layer "' + name + '" has an invalid pos sample.');
                }
              }
            }
            if (prop === "opacity") {
              for (var k = 0; k < values.length; k += 1) {
                if (!hasNumber(values[k])) {
                  throw new Error('Layer "' + name + '" has an invalid opacity sample.');
                }
              }
            }
          }
        }
      }

      function validateModel(data) {
        if (!data || !data.stage || !data.media || !data.layers) {
          throw new Error("Model is missing required top-level keys.");
        }
        if (!hasNumber(data.stage.frameRate) || data.stage.frameRate <= 0) {
          throw new Error("stage.frameRate must be greater than 0.");
        }
        if (!hasNumber(data.stage.frameLength) || data.stage.frameLength <= 0) {
          throw new Error("stage.frameLength must be greater than 0.");
        }
        if (!data.media.src) {
          throw new Error("media.src is required.");
        }
        var layerNames = Object.keys(data.layers);
        for (var i = 0; i < layerNames.length; i += 1) {
          validateLayer(layerNames[i], data.layers[layerNames[i]]);
        }
      }

      function createOverlay(name, layer) {
        var el = document.createElement("div");
        el.className = "all2html-ae__overlay";
        el.setAttribute("data-layer", name);
        el.textContent = layer.text && layer.text.content ? layer.text.content : "";
        if (layer.text && layer.text.altText) {
          el.setAttribute("aria-label", layer.text.altText);
        }
        var style = (layer.text && layer.text.style) || {};
        el.style.fontFamily = style.fontFamily || "Arial, sans-serif";
        el.style.fontSize = (style.fontSize || 16) + "px";
        el.style.fontWeight = style.fontWeight || "400";
        el.style.fontStyle = style.fontStyle || "normal";
        el.style.color = style.color || "rgb(255,255,255)";
        el.style.textAlign = style.textAlign || "left";
        overlaysEl.appendChild(el);
        overlayNodes[name] = el;
      }

      function getCurrentFrame() {
        var raw = Math.floor(videoEl.currentTime * model.stage.frameRate + 0.0001);
        if (raw < 0) return 0;
        if (raw >= model.stage.frameLength) return model.stage.frameLength - 1;
        return raw;
      }

      function getSample(layer, prop, index, fallback) {
        if (
          layer.animatedTransforms &&
          layer.animatedTransforms.indexOf(prop) !== -1 &&
          layer[prop] &&
          index >= 0 &&
          index < layer[prop].length
        ) {
          return layer[prop][index];
        }
        return fallback;
      }

      function syncStageScale() {
        stageScale = stageEl.clientWidth / model.stage.width;
        if (!hasNumber(stageScale) || stageScale <= 0) {
          stageScale = 1;
        }
        overlaysEl.style.width = model.stage.width + "px";
        overlaysEl.style.height = model.stage.height + "px";
        overlaysEl.style.transform = "scale(" + stageScale + ")";
      }

      function updateOverlay(name, layer, frame) {
        var el = overlayNodes[name];
        if (!el) return;

        if (frame < layer.start || frame > layer.end) {
          el.style.display = "none";
          return;
        }

        var sampleIndex = frame - layer.start;
        var pos = getSample(layer, "pos", sampleIndex, layer.static && layer.static.pos);
        var opacity = getSample(
          layer,
          "opacity",
          sampleIndex,
          layer.static && typeof layer.static.opacity === "number" ? layer.static.opacity : 1
        );
        var anchor = (layer.static && layer.static.anchor) || [0, 0];
        var scale = (layer.static && layer.static.scale) || [1, 1];
        var rot = (layer.static && layer.static.rot) || 0;

        el.style.display = "block";
        el.style.left = pos[0] * model.stage.width + "px";
        el.style.top = pos[1] * model.stage.height + "px";
        el.style.opacity = String(opacity);
        el.style.transformOrigin = anchor[0] * 100 + "% " + anchor[1] * 100 + "%";
        el.style.transform =
          "translate(" +
          -anchor[0] * 100 +
          "%, " +
          -anchor[1] * 100 +
          "%) " +
          "scale(" +
          scale[0] +
          ", " +
          scale[1] +
          ") rotate(" +
          rot +
          "deg)";
      }

      function render() {
        var frame = getCurrentFrame();
        var names = Object.keys(model.layers);
        for (var i = 0; i < names.length; i += 1) {
          var name = names[i];
          updateOverlay(name, model.layers[name], frame);
        }
      }

      function tick() {
        render();
        if (!videoEl.paused && !videoEl.ended) {
          rafId = requestAnimationFrame(tick);
        } else {
          rafId = null;
        }
      }

      function ensureLoop() {
        if (rafId === null) {
          rafId = requestAnimationFrame(tick);
        }
      }

      try {
        validateModel(model);
        hideError();
      } catch (err) {
        showError(String(err && err.message ? err.message : err));
        return;
      }

      root.setAttribute("data-ae-frame-rate", String(model.stage.frameRate));
      root.setAttribute("data-ae-frame-length", String(model.stage.frameLength));
      root.setAttribute("data-ae-stage-width", String(model.stage.width));
      root.setAttribute("data-ae-stage-height", String(model.stage.height));

      stageEl.style.aspectRatio = model.stage.width + " / " + model.stage.height;
      stageEl.style.maxWidth = model.stage.width + "px";
      syncStageScale();

      videoEl.src = model.media.src;
      if (model.media.poster) {
        videoEl.poster = model.media.poster;
      }

      var layerNames = Object.keys(model.layers);
      for (var i = 0; i < layerNames.length; i += 1) {
        createOverlay(layerNames[i], model.layers[layerNames[i]]);
      }

      videoEl.addEventListener("play", ensureLoop);
      videoEl.addEventListener("timeupdate", render);
      videoEl.addEventListener("seeked", render);
      videoEl.addEventListener("loadedmetadata", function () {
        syncStageScale();
        render();
      });
      videoEl.addEventListener("pause", render);
      videoEl.addEventListener("ended", render);
      window.addEventListener("resize", function () {
        syncStageScale();
        render();
      });

      root.all2htmlAE = {
        element: root,
        model: model,
        video: videoEl,
        render: render,
      };

      render();
    })();
  </script>
</div>
