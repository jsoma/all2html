name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ExtendScript bundle
        run: pnpm build:extendscript

      - name: Audit Illustrator fixtures
        run: pnpm check:illustrator-fixtures

      - name: Run tests
        run: pnpm test

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Build Illustrator bundle
        run: pnpm build:illustrator

      - name: Build panel
        run: pnpm build:panel

      - name: Build docs
        run: pnpm docs:build
